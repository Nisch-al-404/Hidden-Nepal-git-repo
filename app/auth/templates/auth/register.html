<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Register</title>
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="max-w-md mx-auto mt-6">
            {% for category, message in messages %}
                <div x-data="{ show: true }" x-show="show" class="mb-4 px-4 py-3 rounded flex items-center justify-between {{ 'bg-green-100 text-green-800' if category == 'success' else 'bg-red-100 text-red-800' }}">
                    <span>{{ message }}</span>
                    <button type="button" @click="show = false" class="ml-4 text-xl font-bold focus:outline-none">&times;</button>
                </div>
            {% endfor %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    {% endif %}
{% endwith %}

<form action="{{url_for('auth.register')}}" method="POST" class="max-w-md mx-auto mt-10 p-6 bg-white rounded shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>

        <label for="username" class="block mb-2 font-medium text-gray-700">Username</label>
        <input type="text" name="username" id="username" required placeholder="Enter your Full name"
                class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" />

        <label for="email" class="block mb-2 font-medium text-gray-700">Email</label>
        <input type="email" name="email" id="email" required placeholder="Enter your email"
                class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4" />

        <label for="password" class="block mb-2 font-medium text-gray-700">Password</label>
        <input type="password" name="password" id="password" required placeholder="Enter your password"
                class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-6" />

        <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition duration-200">Register</button>
</form>
</html>
