<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/{{settings.favicon}}" type="image/x-icon">
  <title>Login</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js for flash message dismiss -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4">

  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-sm sm:max-w-md px-4">
    {% for category, message in messages %}
    <div x-data="{ show: true }" x-show="show"
      class="mb-3 px-4 py-3 rounded-lg shadow text-sm sm:text-base transition-all duration-300
        {% if category == 'success' %}bg-green-100 text-green-800
        {% elif category == 'error' %}bg-red-100 text-red-800
        {% else %}bg-blue-100 text-blue-800{% endif %}">
      <div class="flex items-center justify-between">
        <span>{{ message }}</span>
        <button type="button" @click="show = false"
          class="ml-4 text-lg font-bold leading-none focus:outline-none">&times;</button>
      </div>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <!-- Login Form -->
  <div class="w-full max-w-sm sm:max-w-md bg-white rounded-2xl shadow-lg p-6 sm:p-8">
    <h2 class="text-xl sm:text-2xl font-bold mb-6 text-center text-gray-800">Login & Contribute</h2>

    <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-5">
      <div>
        <label for="email" class="block text-gray-700 text-sm mb-2">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full px-3 py-2 sm:px-4 sm:py-2.5 border rounded-lg text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="password" class="block text-gray-700 text-sm mb-2">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-3 py-2 sm:px-4 sm:py-2.5 border rounded-lg text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 sm:py-2.5 rounded-lg hover:bg-blue-700 transition text-sm sm:text-base font-medium">
        Login
      </button>
    </form>

    <p class="mt-5 text-center text-gray-600 text-sm sm:text-base">
      Don’t have an account?
      <a href="{{ url_for('auth.register') }}" class="text-blue-600 hover:underline font-medium">Register</a>
    </p>
  </div>

  <script src="{{ url_for('auth.static', filename='auth/login-auth.js') }}"></script>
</body>
</html>
