<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center">
            <span class="text-xl font-bold text-gray-800">Admin Panel</span>
        </div>
        <!-- Hamburger -->
        <div class="md:hidden">
            <button id="menu-btn" class="text-gray-700 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
        
        <!-- Sidebar -->
        <aside class="fixed top-14 left-0 h-full w-64 bg-white border-r border-gray-200 hidden md:flex flex-col pt-8">
            <a href="#" class="px-6 py-3 text-gray-700 hover:text-blue-600">Dashboard</a>
            <a href="#" class="px-6 py-3 text-gray-700 hover:text-blue-600">Users</a>
            <a href="#" class="px-6 py-3 text-gray-700 hover:text-blue-600">Settings</a>
            <a href="{{url_for('auth.logout')}}" class="px-6 py-3 text-gray-700 hover:text-blue-600">Logout</a>
        </aside>
        <!-- Mobile Sidebar -->
        <div id="mobile-menu" class="fixed top-14 left-0 h-full w-64 bg-white border-r border-gray-200 z-50 md:hidden hidden  pt-2 flex-col shadow-lg transition-transform duration-300">
         
            <nav class="flex flex-col gap-1">
            <a href="#" class="px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded transition">Dashboard</a>
            <a href="#" class="px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded transition">Users</a>
            <a href="#" class="px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded transition">Settings</a>
            <a href="#" class="px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded transition">Logout</a>
            </nav>
        </div>
        </nav>
    <!-- Main Content -->
    <div class="flex">
        <!-- Desktop Sidebar (already present in layout, so leave space here) -->
        <div class="hidden md:block w-64"></div>
        <main class="flex-1 p-4">
            <h1 class="text-2xl font-semibold text-gray-800 mb-6">Dashboard Overview</h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
                    <span class="text-3xl font-bold text-blue-600">120</span>
                    <span class="text-gray-600 mt-2">Users</span>
                </div>
                <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
                    <span class="text-3xl font-bold text-green-600">34</span>
                    <span class="text-gray-600 mt-2">Posts</span>
                </div>
                <div class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
                    <span class="text-3xl font-bold text-red-600">5</span>
                    <span class="text-gray-600 mt-2">Pending Requests</span>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Recent Activity</h2>
                <ul class="divide-y divide-gray-200">
                    <li class="py-2 flex justify-between">
                        <span class="text-gray-700">User JohnDoe registered</span>
                        <span class="text-gray-400 text-sm">2 hours ago</span>
                    </li>
                    <li class="py-2 flex justify-between">
                        <span class="text-gray-700">New post added by Jane</span>
                        <span class="text-gray-400 text-sm">4 hours ago</span>
                    </li>
                    <li class="py-2 flex justify-between">
                        <span class="text-gray-700">Settings updated</span>
                        <span class="text-gray-400 text-sm">1 day ago</span>
                    </li>
                </ul>
            </div>
            {% block content %}
            <!-- Page content goes here -->
            {% endblock %}
        </main>
    </div>
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
