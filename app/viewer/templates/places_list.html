{% extends "layout.html" %} {% block content %}
<div
  id="placesGrid"
  class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8"
></div>

<script>
  // --- User Location and Radius ---
  let userLocation = null;
  let userRadius = 0.5; // default in km

  function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = ((lat2 - lat1) * Math.PI) / 180;
    const dLon = ((lon2 - lon1) * Math.PI) / 180;
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos((lat1 * Math.PI) / 180) *
        Math.cos((lat2 * Math.PI) / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  async function loadPlaces() {
    // Read search query from local page input, or from nav input if present
    const qEl =
      document.getElementById("searchInput") ||
      document.getElementById("navSearchInput");
    const q = qEl ? (qEl.value || "").trim() : "";
    const statusEl = document.getElementById("filterStatus");
    const categoryEl = document.getElementById("filterCategory");
    const status = statusEl ? statusEl.value : "";
    const category = categoryEl ? categoryEl.value : "";
    let url = "/api/filter?status=approved";
    if (q) {
      url = `/api/search?q=${encodeURIComponent(q)}`;
    } else if (status) {
      url = `/api/filter?status=${encodeURIComponent(status)}`;
    }
    if (category) {
      url +=
        (url.includes("?") ? "&" : "?") +
        `category=${encodeURIComponent(category)}`;
    }
    const res = await fetch(url);
    const places = await res.json();
    renderPlaces(places);
  }

  function renderPlaces(places) {
    let html = "";
    if (!places || places.length === 0) {
      html =
        '<div class="col-span-full text-center text-gray-500">No places found.</div>';
    } else {
      for (const place of places) {
        let highlight = false;
        if (userLocation && place.latitude && place.longitude) {
          const dist = getDistanceFromLatLonInKm(
            userLocation.lat,
            userLocation.lng,
            place.latitude,
            place.longitude
          );
          if (dist <= userRadius) highlight = true;
        }
        const pid =
          place.place_id || place.id || place.ID || place.placeId || "";
        html += `
        <div class="bg-white rounded-lg shadow-lg overflow-hidden flex flex-col ${
          highlight ? "ring-4 ring-green-400 ring-opacity-60" : ""
        }">
            <img src="${
              place.image_url || "/static/images/placeholder.jpg"
            }" alt="Image" class="w-full h-64 object-cover" />
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
                <a href="/places/${pid}" class="text-lg font-semibold mb-2 text-blue-700 hover:underline">${
          place.name
        }</a>
              <p class="text-gray-600">${
                place.description
                  ? place.description.substring(0, 100) +
                    (place.description.length > 100 ? "..." : "")
                  : ""
              }</p>
            </div>
          </div>
        </div>
      `;
      }
    }
    const grid = document.getElementById("placesGrid");
    if (grid) grid.innerHTML = html;
  }

  // helper for sidebar "Show Near Me" integration
  async function loadPlacesNearby(lat, lng, radiusKm = 0.1) {
    const res = await fetch(
      `/api/nearby?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(
        lng
      )}&radius=${encodeURIComponent(radiusKm)}`
    );
    const places = await res.json();
    renderPlaces(places);
  }

  function askLocationAndReload() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function (pos) {
        userLocation = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
        };
        loadPlaces();
      });
    } else {
      alert("Geolocation is not supported by your browser.");
    }
  }

  function onRadiusChange(e) {
    userRadius = parseFloat(e.target.value);
    loadPlaces();
  }

  document.getElementById("searchForm").onsubmit = function (e) {
    e.preventDefault();
    loadPlaces();
  };
  document.getElementById("getLocationBtn").onclick = askLocationAndReload;
  document.getElementById("radiusSelect").onchange = onRadiusChange;
  // Expose functions to global scope so the layout's sidebar can call them
  window.renderPlaces = renderPlaces;
  window.loadPlaces = loadPlaces;
  window.loadPlacesNearby = loadPlacesNearby;
  // If URL contains ?q=... populate the search input(s)
  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  window.addEventListener("load", function () {
    const qParam = getQueryParam("q");
    if (qParam) {
      const localInput = document.getElementById("searchInput");
      const navInput = document.getElementById("navSearchInput");
      if (localInput) localInput.value = qParam;
      if (navInput) navInput.value = qParam;
    }
    loadPlaces();
  });
</script>
{% endblock %}
