<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Hidden Nepal{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-white shadow">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-600">Hidden Nepal</a>
            <ul class="flex space-x-6">
                <li><a href="/" class="text-gray-700 hover:text-blue-600">Home</a></li>
                <li><a href="/about" class="text-gray-700 hover:text-blue-600">About</a></li>
                <li><a href="/contact" class="text-gray-700 hover:text-blue-600">Contact</a></li>
                <li><a href="{{url_for('auth.login')}}" class="text-gray-700 hover:text-blue-600">Login</a></li>
                <li><a href="{{url_for('auth.register')}}" class="text-gray-700 hover:text-blue-600">Register</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-8">
        {% block content %}
        <!-- Page content goes here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow mt-8">
        <div class="container mx-auto px-4 py-6 text-center text-gray-500">
            &copy; {{ year | default(2024) }} Hidden Nepal. All rights reserved.
        </div>
    </footer>

</body>
</html>
