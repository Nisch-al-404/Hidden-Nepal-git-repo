<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Hidden Nepal{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body,
      html {
        font-family: "Poppins", Arial, sans-serif;
      }
    </style>
  </head>
  <body class="flex flex-col min-h-screen bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow sticky top-0 z-50">
      <div
        class="container mx-auto px-4 py-4 flex justify-between items-center"
      >
        <a href="/" class="text-3xl font-extrabold text-blue-700 tracking-tight"
          >Hidden <span class="text-pink-500">Nepal</span></a
        >
        <!-- Hamburger Icon for Mobile -->
        <button
          id="nav-toggle"
          class="lg:hidden text-3xl text-blue-700 focus:outline-none"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
        <div
          id="nav-menu"
          class="hidden lg:flex lg:items-center w-full lg:w-auto flex-col lg:flex-row lg:space-x-6 mt-4 lg:mt-0 bg-white lg:bg-transparent p-4 lg:p-0 rounded-lg shadow-lg lg:shadow-none"
        >
          <ul
            class="flex flex-col lg:flex-row lg:space-x-6 space-y-2 lg:space-y-0 w-full lg:w-auto"
          >
            <li>
              <a
                href="/"
                class="text-gray-700 font-semibold hover:text-blue-600 transition"
                >Home</a
              >
            </li>
            <li>
              <a
                href="/about"
                class="text-gray-700 font-semibold hover:text-blue-600 transition"
                >About</a
              >
            </li>
            <li>
              <a
                href="/contact"
                class="text-gray-700 font-semibold hover:text-blue-600 transition"
                >Contact</a
              >
            </li>
            <li>
              <a
                href="{{url_for('auth.login')}}"
                class="text-gray-700 font-semibold hover:text-blue-600 transition"
                >Login</a
              >
            </li>
            <li>
              <a
                href="{{url_for('auth.register')}}"
                class="text-gray-700 font-semibold hover:text-blue-600 transition"
                >Register</a
              >
            </li>
          </ul>
          <!-- Search Bar -->
          <form
            action="/search"
            method="get"
            class="flex mt-4 lg:mt-0 w-full lg:w-auto"
          >
            <input
              type="text"
              name="q"
              placeholder="Search..."
              class="w-full lg:w-48 px-3 py-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
            />
            <button
              type="submit"
              class="px-4 py-2 bg-blue-600 text-white rounded-r-lg hover:bg-blue-700 transition font-semibold"
            >
              Search
            </button>
          </form>
        </div>
      </div>
      <script>
        // Responsive Navbar Toggle
        const navToggle = document.getElementById("nav-toggle");
        const navMenu = document.getElementById("nav-menu");
        navToggle &&
          navToggle.addEventListener("click", () => {
            navMenu.classList.toggle("hidden");
          });
      </script>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 container mx-auto px-4 py-8 font-normal text-gray-800">
      {% block content %}
      <!-- Page content goes here -->
      {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow mt-8">
      <div
        class="container mx-auto px-4 py-6 text-center text-gray-500 font-medium tracking-wide"
      >
        &copy; {{ year | default(2024) }}
        <span class="text-blue-700 font-bold">Hidden Nepal</span>. All rights
        reserved.
      </div>
    </footer>
  </body>
</html>
