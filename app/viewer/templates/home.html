{% extends "layout.html" %} {% block content %}
<h1 class="text-3xl font-bold mb-6 text-center text-blue-700">
  Hidden Nepal Gallery
</h1>
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
  {% for img in images %}
  <div class="bg-white rounded-lg shadow-lg overflow-hidden flex flex-col">
    <img
      src="/static/uploads/{{ img.image_url }}"
      alt="Image"
      class="w-full h-64 object-cover"
    />
    <div class="p-4 flex-1 flex flex-col justify-between">
      <div>
        <p class="text-lg font-semibold mb-2">
         
          {{ img.description }}</p>
        <p class="text-gray-600">
          Weather: <span class="font-medium">{{ img.weather }}</span>
        </p>
        <p class="text-gray-600">
          Temperature:
          <span class="font-medium">{{ img.temperature }}&#8451;</span>
        </p>
      </div>
    </div>
  </div>
  {% else %}
  <div class="col-span-full text-center text-gray-500">No images found.</div>
  {% endfor %}
</div>
{% endblock %}
