<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Contributor Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-lg hidden md:flex flex-col p-5">
    <div class="mb-8 text-center">
      <h2 class="text-xl font-bold text-indigo-600">Contributor</h2>
      <p class="text-sm text-gray-500">Your Role: Contributor</p>
    </div>

    <nav class="space-y-3">
       <a href="{{ url_for('contributor.my_contributions') }}"
         class="flex items-center px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 font-medium text-gray-700 {% if request.endpoint == 'contributor.my_contributions' %}bg-indigo-100 text-indigo-700{% endif %}">
        📜 My Contributions
      </a>
      <a href="{{ url_for('contributor.add_place') }}"
         class="flex items-center px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 font-medium text-gray-700 {% if request.endpoint == 'contributor.add_place' %}bg-indigo-100 text-indigo-700{% endif %}">
        ➕ Add Place
      </a>
     
      <a href="{{ url_for('contributor.profile') }}"
         class="flex items-center px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 font-medium text-gray-700 {% if request.endpoint == 'contributor.profile' %}bg-indigo-100 text-indigo-700{% endif %}">
        👤 Profile
      </a>
      <a href="{{ url_for('auth.logout') }}"
         class="flex items-center px-4 py-2 rounded-lg hover:bg-red-50 hover:text-red-700 font-medium text-gray-700">
        🚪 Logout
      </a>
    </nav>
  </aside>

  <!-- Mobile Navbar -->
  <div class="md:hidden fixed top-0 left-0 w-full bg-white shadow p-4 flex justify-between items-center z-50">
    <h2 class="text-lg font-bold text-indigo-600">Contributor</h2>
    <button id="menu-toggle" class="text-gray-700 focus:outline-none">☰</button>
  </div>
  <div id="mobile-menu" class="md:hidden fixed top-0 left-0 w-64 h-full bg-white shadow-lg transform -translate-x-full transition-transform p-5 z-40">
    <button id="menu-close" class="mb-6 text-gray-700">✖</button>
    <nav class="space-y-3">
      <a href="{{ url_for('contributor.my_contributions') }}" class="block px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 font-medium text-gray-700">📜 My Contributions</a>
      <a href="{{ url_for('contributor.add_place') }}" class="block px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 font-medium text-gray-700">➕ Add Place</a>
      
      <a href="{{ url_for('contributor.profile') }}" class="block px-4 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 font-medium text-gray-700">👤 Profile</a>
      <a href="{{ url_for('auth.logout') }}" class="block px-4 py-2 rounded-lg hover:bg-red-50 hover:text-red-700 font-medium text-gray-700">🚪 Logout</a>
    </nav>
  </div>

  <!-- Main Content -->
  <main class="flex-1 p-6 md:ml-64 mt-14 md:mt-0">
    {% block content %}
    <!-- Page-specific content goes here -->
    {% endblock %}
  </main>

  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const menuClose = document.getElementById('menu-close');
    const mobileMenu = document.getElementById('mobile-menu');

    if (menuToggle) {
      menuToggle.addEventListener('click', () => {
        mobileMenu.classList.remove('-translate-x-full');
      });
    }

    if (menuClose) {
      menuClose.addEventListener('click', () => {
        mobileMenu.classList.add('-translate-x-full');
      });
    }
  </script>
</body>
</html>
