<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/{{settings.favicon}}" type="image/x-icon">
  <title>{% block title %}Contributor Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col md:flex-row">

  <!-- 🌐 Mobile Navbar -->
  <header class="md:hidden fixed top-0 left-0 w-full bg-white shadow-md z-50 flex justify-between items-center px-5 py-3">
    <a href="/"><h1 class="text-lg font-bold text-indigo-600">Hidden Nepal</h1></a>
    <button id="menu-toggle" class="text-2xl text-gray-700 focus:outline-none">☰</button>
  </header>

  <!-- 📱 Mobile Sidebar -->
  <aside id="mobile-menu" 
         class="fixed inset-y-0 left-0 w-64 bg-white shadow-lg transform -translate-x-full transition-transform duration-300 ease-in-out z-40 md:hidden">
    <div class="flex justify-between items-center p-4 border-b">
      <h2 class="text-lg font-bold text-indigo-600">Menu</h2>
      <button id="menu-close" class="text-gray-600 text-xl">✖</button>
    </div>
    <nav class="p-5 space-y-2">
      <a href="{{ url_for('contributor.my_contributions') }}" class="block px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 text-gray-700 font-medium">
        📜 My Contributions
      </a>
      <a href="{{ url_for('contributor.add_place') }}" class="block px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 text-gray-700 font-medium">
        ➕ Add Place
      </a>
      <a href="{{ url_for('contributor.profile') }}" class="block px-3 py-2 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 text-gray-700 font-medium">
        👤 Profile
      </a>
      <a href="{{ url_for('auth.logout') }}" class="block px-3 py-2 rounded-lg hover:bg-red-50 hover:text-red-700 text-gray-700 font-medium">
        🚪 Logout
      </a>
    </nav>
  </aside>

  <!-- 💻 Desktop Sidebar -->
  <aside class="hidden md:flex md:flex-col w-64 bg-white shadow-lg h-screen p-6 sticky top-0 overflow-auto">
    <div class="mb-8 text-center bg-gray-50 p-4 rounded-lg m-[-30px]">
      <h2 class="text-2xl font-bold text-indigo-600">{{topuser.name}}</h2>
      <p class="text-sm text-gray-500">Your Role: {{topuser.role}} </p>
    </div>

    <nav class="space-y-3">
      <a href="/" class="flex items-center px-4 py-2 rounded-lg transition font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700">🏠Home</a>
      <a href="{{ url_for('contributor.my_contributions') }}"
         class="flex items-center px-4 py-2 rounded-lg transition font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 {% if request.endpoint == 'contributor.my_contributions' %}bg-indigo-100 text-indigo-700{% endif %}">
        📜 My Contributions
      </a>
      <a href="{{ url_for('contributor.add_place') }}"
         class="flex items-center px-4 py-2 rounded-lg transition font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 {% if request.endpoint == 'contributor.add_place' %}bg-indigo-100 text-indigo-700{% endif %}">
        ➕ Add Place
      </a>
      <a href="{{ url_for('contributor.profile') }}"
         class="flex items-center px-4 py-2 rounded-lg transition font-medium text-gray-700 hover:bg-indigo-50 hover:text-indigo-700 {% if request.endpoint == 'contributor.profile' %}bg-indigo-100 text-indigo-700{% endif %}">
        👤 Profile
      </a>
      <a href="{{ url_for('auth.logout') }}"
         class="flex items-center px-4 py-2 rounded-lg transition font-medium text-red-600 hover:bg-red-50">
        🚪 Logout
      </a>
    </nav>
  </aside>

  <!-- 🧭 Main Content -->
  <main class="flex-1 mt-14 md:mt-0 bg-gradient-to-b from-emerald-50 to-amber-50">
    {% block content %}
    <!-- Page content goes here -->
    {% endblock %}
  </main>

  <!-- 📜 Script -->
  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const menuClose = document.getElementById('menu-close');
    const mobileMenu = document.getElementById('mobile-menu');

    if (mobileMenu && menuToggle && menuClose) {
      menuToggle.addEventListener('click', () => {
        mobileMenu.classList.remove('-translate-x-full');
      });

      menuClose.addEventListener('click', () => {
        mobileMenu.classList.add('-translate-x-full');
      });

      document.addEventListener('click', (e) => {
        if (!mobileMenu.contains(e.target) && !menuToggle.contains(e.target)) {
          mobileMenu.classList.add('-translate-x-full');
        }
      });
    }
  </script>

</body>
</html>
