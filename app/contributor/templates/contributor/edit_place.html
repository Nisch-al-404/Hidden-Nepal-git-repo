{% extends "contributor/contributor_layout.html" %}
{% block content %}
<section class="bg-gray-100 min-h-screen py-10 px-4 flex items-center justify-center">
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            ✏️ Edit Place – {{ place.name }}
        </h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            <!-- Place Name -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Place Name</label>
                <input type="text" name="name" value="{{ place.name }}" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Description -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Description</label>
                <textarea name="description" required rows="4"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">{{ place.description }}</textarea>
            </div>

            <!-- Coordinates -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Latitude</label>
                    <input type="text" id="latitude" name="latitude" value="{{ place.latitude }}"  required
                        class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600">
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Longitude</label>
                    <input type="text" id="longitude" name="longitude" value="{{ place.longitude }}"  required
                        class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600">
                </div>
            </div>

            <!-- Map -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Select Location</label>
                <div id="map" class="w-full h-72 rounded-lg shadow border"></div>
            </div>

            <!-- Current Images -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Current Images</label>
                <div class="flex flex-wrap gap-4">
                    {% if images %}
                        {% for img in images %}
                            <div class="rounded-lg shadow-md w-40 h-28 overflow-hidden">
                                <img src="/{{ img.image_url| replace('app/', '') }}" alt="Place Image {{ img.image_id }}"
                                     class="w-full h-full object-cover">
                            </div>
                        {% endfor %}
                    {% else %}
                        <p class="text-gray-500">No images uploaded.</p>
                    {% endif %}
                </div>
            </div>

            <!-- Upload New Image -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Upload New Image (optional)</label>
                <input type="file" name="images" multiple accept="image/*"
                    class="w-full px-3 py-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Submit Button -->
            <div class="text-center">
                <button type="submit"
                    class="px-6 py-3 bg-indigo-600 text-white rounded-lg font-medium shadow hover:bg-indigo-700 transition duration-200">
                    ✅ Update Place
                </button>
            </div>
        </form>
    </div>

    <!-- Leaflet JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView(
            [parseFloat('{{ place.latitude|default(0) }}'), parseFloat('{{ place.longitude|default(0) }}')],
            10
        );
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([
            parseFloat('{{ place.latitude|default(0) }}'),
            parseFloat('{{ place.longitude|default(0) }}')
        ]).addTo(map);

        map.on('click', function (e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);

            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;

            marker.setLatLng(e.latlng);
        });
    </script>
</section>
{% endblock %}
